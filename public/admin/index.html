<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>igServer 관리 대시보드</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#22c58b;
    --danger:#ef4a5a; --warn:#f0a93b; --radius:12px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
    font-style:normal;
  }
  *{box-sizing:border-box;font-style:normal}
  body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;font-style:normal}
  input,select{font-family:inherit;font-style:normal}
  a{color:var(--accent);text-decoration:none}
  .hidden{display:none !important}

  /* 로그인 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:36px;width:360px}
  .login-card h1{margin:0 0 4px;font-size:22px;font-weight:700}
  .login-card p{margin:0 0 24px;color:var(--muted);font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}
  .field input{width:100%;padding:11px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
  .field input:focus{outline:none;border-color:var(--accent)}

  /* 레이아웃 */
  #app{display:flex;min-height:100vh}
  .sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column}
  .brand{font-size:18px;font-weight:800;padding:6px 10px 20px;letter-spacing:-0.3px}
  .brand span{color:var(--accent)}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav button{text-align:left;padding:10px 12px;background:none;border:none;color:var(--muted);border-radius:8px;font-size:14px}
  .nav button:hover{background:var(--panel2);color:var(--text)}
  .nav button.active{background:var(--accent);color:#fff;font-weight:600}
  .sidebar-foot{border-top:1px solid var(--border);padding-top:14px;font-size:12px;color:var(--muted)}
  .sidebar-foot button{width:100%;margin-top:8px;padding:8px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:8px}

  .main{flex:1;padding:28px 32px;overflow:auto}
  .page-title{font-size:22px;font-weight:700;margin:0 0 20px}

  /* 카드/그리드 */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .stat .label{color:var(--muted);font-size:12px;margin-bottom:8px}
  .stat .value{font-size:28px;font-weight:700}
  .stat .sub{color:var(--muted);font-size:12px;margin-top:4px}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
  .panel h2{margin:0 0 16px;font-size:16px;font-weight:700}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td.mono,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
  tr:last-child td{border-bottom:none}

  .btn{padding:9px 16px;background:var(--accent);border:none;color:#fff;border-radius:8px;font-size:13px;font-weight:600}
  .btn:hover{opacity:.9}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  .btn.danger{background:var(--danger)}
  .btn.warn{background:var(--warn);color:#1a1a1a}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.active{background:rgba(34,197,139,.15);color:var(--accent2)}
  .badge.disabled{background:rgba(239,74,90,.15);color:var(--danger)}
  .badge.up{background:rgba(34,197,139,.15);color:var(--accent2)}
  .badge.plan-free{background:rgba(154,163,178,.2);color:var(--muted)}
  .badge.plan-pro{background:rgba(79,140,255,.18);color:var(--accent)}
  .badge.plan-unlimited{background:rgba(34,197,139,.18);color:var(--accent2)}
  .progress{height:8px;background:var(--panel2);border-radius:10px;overflow:hidden}
  .progress>div{height:100%;border-radius:10px;transition:width .3s}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .toolbar input{padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);min-width:200px}

  .key-box{display:flex;align-items:center;gap:8px}
  .key-box code{background:var(--panel2);padding:5px 9px;border-radius:6px;font-size:11px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:16px;overflow:auto;font-size:12px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .tabs button{padding:9px 14px;background:none;border:none;color:var(--muted);border-bottom:2px solid transparent;font-size:13px}
  .tabs button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--accent2);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;z-index:100}
  .toast.show{opacity:1}
  .empty{color:var(--muted);text-align:center;padding:40px;font-size:13px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:460px;max-height:80vh;overflow:auto}
  .modal h3{margin:0 0 16px;font-size:17px;font-weight:700}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div class="login-card">
    <h1>igServer</h1>
    <p>STUDIO ig 공통 서버 관리 대시보드</p>
    <div class="field"><label>관리자 이메일</label><input id="l-email" type="email" value="admin@studio-ig.local"></div>
    <div class="field"><label>비밀번호</label><input id="l-pw" type="password" placeholder="비밀번호" autocomplete="current-password"></div>
    <button class="btn" style="width:100%;padding:11px" onclick="doLogin()">로그인</button>
    <p id="l-err" style="color:var(--danger);margin-top:12px;font-size:12px"></p>
  </div>
</div>

<!-- 앱 -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">ig<span>Server</span></div>
    <nav class="nav">
      <button data-page="overview" class="active" onclick="go('overview')">개요</button>
      <button data-page="projects" onclick="go('projects')">프로젝트</button>
      <button data-page="data" onclick="go('data')">데이터</button>
      <button data-page="nodes" onclick="go('nodes')">클러스터 노드</button>
      <button data-page="audit" onclick="go('audit')">감사 로그</button>
      <button data-page="admins" onclick="go('admins')" id="nav-admins" style="display:none">관리자</button>
      <button data-page="guide" onclick="go('guide')">연동 가이드</button>
    </nav>
    <div class="sidebar-foot">
      <div id="foot-driver">driver: -</div>
      <button class="ghost" onclick="logout()">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <!-- 개요 -->
    <section id="page-overview">
      <h1 class="page-title">개요</h1>
      <div class="stat-grid" id="overview-stats"></div>
      <div class="panel"><h2>분당 요청 (최근 30분)</h2><div id="req-chart"></div></div>
      <div class="panel"><h2>실시간 지표</h2><div class="stat-grid" id="overview-metrics"></div></div>
    </section>

    <!-- 프로젝트 -->
    <section id="page-projects" class="hidden">
      <h1 class="page-title">프로젝트</h1>
      <div class="toolbar">
        <input id="p-name" placeholder="새 프로젝트 이름 (예: 컷룸)">
        <button class="btn" onclick="createProject()">+ 프로젝트 생성</button>
        <button class="btn ghost" onclick="document.getElementById('import-file').click()">백업 파일로 복원</button>
        <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importProject(this)">
      </div>
      <div class="panel"><div id="projects-list"></div></div>
    </section>

    <!-- 데이터 뷰어 -->
    <section id="page-data" class="hidden">
      <h1 class="page-title">데이터</h1>
      <div class="toolbar">
        <select id="dv-project" onchange="dvLoadCollections()" style="padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);min-width:150px"></select>
        <select id="dv-collection" onchange="dvLoad()" style="padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);min-width:150px"></select>
        <input id="dv-q" placeholder="검색어" onkeydown="if(event.key==='Enter')dvLoad()">
        <label style="color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="dv-deleted" onchange="dvLoad()"> 휴지통</label>
        <button class="btn ghost" onclick="dvLoad()">새로고침</button>
      </div>
      <div class="panel"><div id="dv-list"><div class="empty">프로젝트와 컬렉션을 선택하세요.</div></div></div>
    </section>

    <!-- 노드 -->
    <section id="page-nodes" class="hidden">
      <h1 class="page-title">클러스터 노드</h1>
      <p style="color:var(--muted);margin-top:-10px">여러 대(라즈베리파이·PC)를 워커로 붙이면 여기에 자동 등록됩니다.</p>
      <div class="panel"><div id="nodes-list"></div></div>
    </section>

    <!-- 감사 로그 -->
    <section id="page-audit" class="hidden">
      <h1 class="page-title">감사 로그</h1>
      <div class="panel"><div id="audit-list"></div></div>
    </section>

    <!-- 관리자 -->
    <section id="page-admins" class="hidden">
      <h1 class="page-title">관리자</h1>
      <div class="toolbar" id="admin-add-bar">
        <input id="ad-email" placeholder="관리자 이메일" style="flex:1">
        <input id="ad-pw" type="password" placeholder="비밀번호 (8자+)">
        <select id="ad-role" style="padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
          <option value="admin">admin</option>
          <option value="viewer">viewer</option>
          <option value="owner">owner</option>
        </select>
        <button class="btn" onclick="addAdmin()">+ 추가</button>
      </div>
      <div class="panel"><div id="admins-list"></div></div>
      <p style="color:var(--muted);font-size:12px">owner: 전체 권한(관리자 관리 포함) · admin: 프로젝트 관리 · viewer: 조회만</p>
    </section>

    <!-- 연동 가이드 -->
    <section id="page-guide" class="hidden">
      <h1 class="page-title">연동 가이드</h1>
      <div class="panel" id="guide-content"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modal-root"></div>

<script>
const API = '/admin/api';
let token = localStorage.getItem('ig_admin_token') || '';
let myRole = 'viewer';
let state = { projects: [], overview: null };

// ---- API helper ----
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401 && token) { logout(); throw new Error('세션 만료'); }
  const data = res.headers.get('content-type')?.includes('json') ? await res.json() : null;
  if (!res.ok) throw new Error(data?.message || data?.error || ('HTTP ' + res.status));
  return data;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function copy(text) { navigator.clipboard.writeText(text).then(() => toast('복사됨')); }
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTime(ms){ if(!ms) return '-'; const d=new Date(ms); return d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

// ---- 로그인 ----
async function doLogin() {
  const email = document.getElementById('l-email').value;
  const pw = document.getElementById('l-pw').value;
  try {
    const r = await api('POST', '/login', { email, password: pw });
    token = r.token; localStorage.setItem('ig_admin_token', token);
    showApp();
  } catch (e) { document.getElementById('l-err').textContent = e.message; }
}
function logout() { token=''; localStorage.removeItem('ig_admin_token'); document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); }
document.getElementById('l-pw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  try { const me = await api('GET', '/me'); myRole = me.role; } catch {}
  applyRole();
  go('overview');
}
function applyRole() {
  // 관리자 메뉴는 admin 이상, 추가 UI는 owner만
  document.getElementById('nav-admins').style.display = (myRole === 'admin' || myRole === 'owner') ? '' : 'none';
  const addBar = document.getElementById('admin-add-bar');
  if (addBar) addBar.style.display = myRole === 'owner' ? '' : 'none';
}

// ---- 네비게이션 ----
let current = 'overview';
function go(page) {
  current = page;
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page===page));
  document.querySelectorAll('.main section').forEach(s => s.classList.add('hidden'));
  document.getElementById('page-'+page).classList.remove('hidden');
  if (page==='overview') loadOverview();
  else if (page==='projects') loadProjects();
  else if (page==='data') dvInit();
  else if (page==='nodes') loadNodes();
  else if (page==='audit') loadAudit();
  else if (page==='admins') loadAdmins();
  else if (page==='guide') loadGuide();
}

// ---- 데이터 뷰어 ----
let dvOffset = 0;
async function dvInit(){
  if(!state.projects.length){ try{ state.projects=(await api('GET','/projects')).projects; }catch{} }
  const sel=document.getElementById('dv-project');
  sel.innerHTML='<option value="">프로젝트 선택</option>'+state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  document.getElementById('dv-collection').innerHTML='';
}
async function dvLoadCollections(){
  const pid=document.getElementById('dv-project').value;
  const cs=document.getElementById('dv-collection');
  if(!pid){ cs.innerHTML=''; return; }
  try{
    const d=await api('GET','/projects/'+pid);
    const colls=d.collections||[];
    cs.innerHTML='<option value="">컬렉션 선택</option>'+colls.map(c=>`<option value="${esc(c.collection)}">${esc(c.collection)} (${c.count})</option>`).join('');
  }catch(e){ toast(e.message); }
}
async function dvLoad(){
  const pid=document.getElementById('dv-project').value;
  const coll=document.getElementById('dv-collection').value;
  if(!pid||!coll){ document.getElementById('dv-list').innerHTML='<div class="empty">프로젝트와 컬렉션을 선택하세요.</div>'; return; }
  const q=document.getElementById('dv-q').value.trim();
  const deleted=document.getElementById('dv-deleted').checked;
  const qs=new URLSearchParams({limit:50,offset:dvOffset}); if(q)qs.set('q',q); if(deleted)qs.set('deleted','true');
  try{
    const r=await api('GET',`/projects/${pid}/data/${coll}?${qs}`);
    if(!r.items.length){ document.getElementById('dv-list').innerHTML='<div class="empty">레코드가 없습니다.</div>'; return; }
    document.getElementById('dv-list').innerHTML=`
      <div style="color:var(--muted);font-size:12px;margin-bottom:10px">총 ${r.count}건${deleted?' (휴지통)':''}</div>
      <table><thead><tr><th>ID</th><th>데이터</th><th>수정</th><th>작업</th></tr></thead><tbody>
      ${r.items.map(it=>`<tr>
        <td class="mono" style="font-size:11px">${esc(it.id)}${it.deleted?' <span class="badge disabled">삭제됨</span>':''}</td>
        <td class="mono" style="font-size:11px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(it.data))}</td>
        <td class="mono" style="font-size:11px">${fmtTime(it.updated_at)}</td>
        <td><div class="row-actions">
          <button class="btn sm ghost" onclick='dvEdit("${pid}","${coll}","${it.id}",${JSON.stringify(JSON.stringify(it.data))})'>편집</button>
          ${it.deleted?`<button class="btn sm ghost" onclick="dvRestore('${pid}','${coll}','${it.id}')">복구</button>`:`<button class="btn sm danger" onclick="dvDelete('${pid}','${coll}','${it.id}')">삭제</button>`}
        </div></td></tr>`).join('')}
      </tbody></table>`;
  }catch(e){ toast(e.message); }
}
function dvEdit(pid,coll,id,dataStr){
  modal(`<h3>레코드 편집</h3><p class="mono" style="color:var(--muted);font-size:11px">${esc(id)}</p>
    <textarea id="dv-json" style="width:100%;height:260px;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:ui-monospace,monospace;font-size:12px">${esc(JSON.stringify(JSON.parse(dataStr),null,2))}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" style="flex:1" onclick="dvSave('${pid}','${coll}','${id}')">저장</button>
      <button class="btn ghost" style="flex:1" onclick="closeModal()">취소</button>
    </div>`);
}
async function dvSave(pid,coll,id){
  let data; try{ data=JSON.parse(document.getElementById('dv-json').value); }catch(e){ toast('JSON 오류: '+e.message); return; }
  try{ await api('PUT',`/projects/${pid}/data/${coll}/${id}`,{data}); toast('저장됨'); closeModal(); dvLoad(); }catch(e){ toast(e.message); }
}
async function dvDelete(pid,coll,id){
  if(!confirm('이 레코드를 삭제할까요? (휴지통으로 이동)')) return;
  try{ await api('DELETE',`/projects/${pid}/data/${coll}/${id}`); toast('삭제됨'); dvLoad(); }catch(e){ toast(e.message); }
}
async function dvRestore(pid,coll,id){
  try{ await api('POST',`/projects/${pid}/data/${coll}/${id}/restore`); toast('복구됨'); dvLoad(); }catch(e){ toast(e.message); }
}

// ---- 관리자 관리 ----
async function loadAdmins(){
  try {
    const r = await api('GET','/admins');
    document.getElementById('admins-list').innerHTML = `
      <table><thead><tr><th>이메일</th><th>역할</th><th>등록</th>${myRole==='owner'?'<th>작업</th>':''}</tr></thead><tbody>
      ${r.admins.map(a=>`<tr>
        <td>${esc(a.email)}</td>
        <td>${myRole==='owner'?`<select onchange="changeRole('${a.id}',this.value)" style="padding:5px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)">${['owner','admin','viewer'].map(x=>`<option value="${x}" ${a.role===x?'selected':''}>${x}</option>`).join('')}</select>`:`<span class="badge plan-${a.role==='owner'?'unlimited':a.role==='admin'?'pro':'free'}">${a.role}</span>`}</td>
        <td class="mono">${fmtTime(a.created_at)}</td>
        ${myRole==='owner'?`<td><button class="btn sm danger" onclick="delAdmin('${a.id}','${esc(a.email)}')">삭제</button></td>`:''}
      </tr>`).join('')}
      </tbody></table>`;
  } catch (e) { toast(e.message); }
}
async function addAdmin(){
  const email=document.getElementById('ad-email').value.trim();
  const password=document.getElementById('ad-pw').value;
  const role=document.getElementById('ad-role').value;
  if(!email||!password){ toast('이메일과 비밀번호를 입력하세요'); return; }
  try { await api('POST','/admins',{email,password,role}); toast('관리자 추가됨'); document.getElementById('ad-email').value='';document.getElementById('ad-pw').value=''; loadAdmins(); }
  catch(e){ toast(e.message); }
}
async function changeRole(id, role){
  try { await api('PATCH','/admins/'+id,{role}); toast('역할 변경: '+role); loadAdmins(); }
  catch(e){ toast(e.message); loadAdmins(); }
}
async function delAdmin(id, email){

async function loadOverview() {
  try {
    const o = await api('GET', '/overview'); state.overview = o;
    document.getElementById('foot-driver').textContent = 'driver: ' + o.driver;
    const online = Object.values(o.presence || {}).reduce((a, b) => a + b, 0);
    document.getElementById('overview-stats').innerHTML = `
      ${stat('프로젝트', o.projects)}
      ${stat('전체 사용자', o.users)}
      ${stat('저장된 데이터', o.records)}
      ${stat('실시간 접속', online)}
      ${stat('가동 시간', fmtUptime(o.metrics.uptimeSeconds))}`;
    document.getElementById('req-chart').innerHTML = renderChart(o.series || []);
    const m = o.metrics;
    document.getElementById('overview-metrics').innerHTML = `
      ${stat('총 요청', m.requests)}
      ${stat('WS 활성 연결', m.wsActive, '누적 '+m.wsConnections)}
      ${stat('p50 지연', m.latency.p50+'ms', 'p95 '+m.latency.p95+'ms / p99 '+m.latency.p99+'ms')}
      ${stat('오류', m.errors, 'rate-limit '+m.rateLimited)}
      ${stat('브로드캐스트', m.broadcasts)}`;
  } catch (e) { toast(e.message); }
}
function stat(label, value, sub){ return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`; }
function renderChart(series){
  if(!series.length) return '<div class="empty">데이터 없음</div>';
  const max=Math.max(1,...series.map(s=>s.count));
  const w=600,h=120,bw=w/series.length;
  const bars=series.map((s,i)=>{const bh=Math.round(s.count/max*(h-24));return `<rect x="${(i*bw+1).toFixed(1)}" y="${h-bh}" width="${(bw-2).toFixed(1)}" height="${bh}" fill="var(--accent)" rx="2"><title>${s.minuteAgo}분 전: ${s.count}건</title></rect>`;}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:140px">${bars}<text x="2" y="13" fill="var(--muted)" font-size="11">최대 ${max}건/분 · 오른쪽이 현재</text></svg>`;
}
function fmtUptime(s){ if(s<60) return s+'초'; if(s<3600) return Math.floor(s/60)+'분'; if(s<86400) return Math.floor(s/3600)+'시간'; return Math.floor(s/86400)+'일'; }

  modal(`<h3>스키마 관리</h3>
    <p style="color:var(--muted);font-size:12px;margin-top:0">컬렉션별 필드 규칙을 지정하면 잘못된 데이터 쓰기를 서버가 막습니다.</p>
    ${cols.length?`<div style="margin-bottom:14px">${cols.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><span class="mono">${esc(c)} (${Object.keys(schemas[c].fields||{}).length}필드${schemas[c].strict?', strict':''})</span><div><button class="btn sm ghost" onclick="editSchema('${id}','${esc(c)}')">편집</button> <button class="btn sm danger" onclick="delSchema('${id}','${esc(c)}')">삭제</button></div></div>`).join('')}</div>`:'<p style="color:var(--muted);font-size:13px">등록된 스키마가 없습니다.</p>'}
    <button class="btn sm" onclick="editSchema('${id}','')">+ 새 컬렉션 스키마</button>
    <button class="btn ghost" style="margin-top:14px;width:100%" onclick="showProject('${id}')">← 상세로</button>`);
}
async function editSchema(id, col){
  let def={fields:{},strict:false};
  if(col){ try{ def=(await api('GET',`/projects/${id}/schemas`)).schemas[col]||def; }catch{} }
  const example=JSON.stringify(def.fields&&Object.keys(def.fields).length?def.fields:{title:{type:'string',required:true,max:50},price:{type:'number',min:0},status:{type:'string',enum:['sale','soldout']}},null,2);
  modal(`<h3>${col?'스키마 편집: '+esc(col):'새 스키마'}</h3>
    ${col?'':`<div class="field"><label style="font-size:12px;color:var(--muted)">컬렉션 이름</label><input id="sc-col" placeholder="products" style="width:100%;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>`}
    <label style="font-size:12px;color:var(--muted);display:block;margin:10px 0 6px">필드 정의 (JSON)</label>
    <textarea id="sc-fields" style="width:100%;height:220px;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:ui-monospace,monospace;font-size:12px">${esc(example)}</textarea>
    <label style="font-size:12px;color:var(--muted);display:block;margin:10px 0 6px"><input type="checkbox" id="sc-strict" ${def.strict?'checked':''}> strict (스키마에 없는 필드 거부)</label>
    <div style="font-size:11px;color:var(--muted)">type: string, number, boolean, array, object · 옵션: required, min, max, enum, pattern</div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn" style="flex:1" onclick="saveSchema('${id}','${esc(col)}')">저장</button>
      <button class="btn ghost" style="flex:1" onclick="manageSchema('${id}')">취소</button>
    </div>`);
}
async function saveSchema(id, col){
  const collection = col || document.getElementById('sc-col').value.trim();
  if(!collection){ toast('컬렉션 이름을 입력하세요'); return; }
  let fields;
  try { fields=JSON.parse(document.getElementById('sc-fields').value); }
  catch(e){ toast('JSON 형식 오류: '+e.message); return; }
  const strict=document.getElementById('sc-strict').checked;
  try { await api('PUT',`/projects/${id}/schemas/${collection}`,{fields,strict}); toast('스키마 저장됨'); manageSchema(id); }
  catch(e){ toast(e.message); }
}
async function delSchema(id, col){
  if(!confirm(`'${col}' 스키마를 삭제할까요? (데이터는 유지, 검증만 해제)`)) return;
  try { await api('DELETE',`/projects/${id}/schemas/${col}`); toast('스키마 삭제됨'); manageSchema(id); }
  catch(e){ toast(e.message); }
}

// ---- 노드 ----
async function loadNodes() {
  try {
    const r = await api('GET','/nodes');
    if (!r.nodes.length) { document.getElementById('nodes-list').innerHTML='<div class="empty">등록된 워커 노드가 없습니다. 단독 실행 중이거나, 워커를 아직 붙이지 않았습니다.</div>'; return; }
    document.getElementById('nodes-list').innerHTML = `
      <table><thead><tr><th>노드</th><th>주소</th><th>역할</th><th>부하</th><th>CPU</th><th>상태</th><th>마지막 응답</th></tr></thead><tbody>
      ${r.nodes.map(n=>{ const meta=n.meta||{}; const alive=Date.now()-n.last_seen<15000;
        return `<tr><td><strong>${esc(n.label||n.id)}</strong></td><td class="mono">${esc(n.url)}</td>
        <td>${esc(n.mode)}</td><td>${(n.load*100).toFixed(0)}%</td><td>${meta.cpus||'-'}</td>
        <td><span class="badge ${alive?'up':'disabled'}">${alive?'정상':'응답없음'}</span></td>
        <td class="mono">${fmtTime(n.last_seen)}</td></tr>`;}).join('')}
      </tbody></table>`;
  } catch (e) { toast(e.message); }
}

// ---- 감사 로그 ----
async function loadAudit() {
  try {
    const r = await api('GET','/audit?limit=200');
    if (!r.audit.length) { document.getElementById('audit-list').innerHTML='<div class="empty">기록 없음</div>'; return; }
    document.getElementById('audit-list').innerHTML = `
      <table><thead><tr><th>시각</th><th>동작</th><th>주체</th><th>IP</th><th>상세</th></tr></thead><tbody>
      ${r.audit.map(a=>`<tr><td class="mono">${fmtTime(a.created_at)}</td><td><strong>${esc(a.action)}</strong></td>
        <td class="mono">${esc(a.actor_id||'-')}</td><td class="mono">${esc(a.ip||'-')}</td>
        <td class="mono">${esc(JSON.stringify(a.meta||{}))}</td></tr>`).join('')}
      </tbody></table>`;
  } catch (e) { toast(e.message); }
}

function guideTab(btn, t) {
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['js','rest','ws'].forEach(x=>document.getElementById('guide-'+x).classList.toggle('hidden', x!==t));
}
