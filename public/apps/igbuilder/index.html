<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>igBuilder — 말로 만드는 웹사이트 빌더</title>
<style>
:root{--bg:#0b0d12;--surface:#141821;--fg:#eef1f6;--muted:#97a0b0;--border:#222836;--accent:#5b8cff;--accent2:#7aa2ff;--accent-fg:#071021;--radius:16px;--f:system-ui,"Malgun Gothic","Noto Sans KR",sans-serif;}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f8fc;--surface:#fff;--fg:#141821;--muted:#5a6475;--border:#e5e9f1;}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font-family:var(--f);line-height:1.6;font-style:normal;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;font-style:normal;letter-spacing:-.015em}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
header{padding:70px 0 36px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800}
.badge{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-flex;align-items:center;justify-content:center;color:var(--accent-fg)}
h1{font-size:clamp(30px,6vw,50px);margin:22px 0 12px}
.sub{color:var(--muted);font-size:19px;max-width:640px;margin:0 auto}
.demo{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:36px 0}
.demo textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--fg);font-family:inherit;font-size:16px;padding:14px;resize:vertical}
button{margin-top:12px;padding:12px 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-family:inherit;font-size:16px;cursor:pointer}
.out{margin-top:16px;border:1px dashed var(--border);border-radius:12px;padding:16px;color:var(--muted);min-height:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:28px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{font-size:18px;margin-bottom:6px}.card p{color:var(--muted);margin:0}
footer{border-top:1px solid var(--border);margin-top:40px;padding:26px 0;color:var(--muted);font-size:14px;text-align:center}
</style></head><body>
<div class="wrap">
<header>
  <div class="logo"><span class="badge">◆</span> STUDIO ig</div>
  <h1>igBuilder</h1>
  <p class="sub">만들고 싶은 웹사이트를 말로 설명하면 됩니다. 화면 구성, 글, 디자인까지 한 번에.</p>
</header>
<div class="demo">
  <div class="muted" style="margin-bottom:8px">데모: 원하는 사이트를 한 줄로 설명해 보세요</div>
  <textarea id="prompt" placeholder="예: 동네 베이커리 홈페이지. 메뉴, 사진 갤러리, 오시는 길, 예약 문의 폼"></textarea>
  <button onclick="gen()">미리보기 생성</button>
  <div id="out" class="out">여기에 생성된 사이트 구성이 표시됩니다.</div>
</div>
<div class="grid">
  <div class="card"><h3>말로 생성</h3><p>복잡한 편집기 없이 설명만으로 페이지가 만들어집니다.</p></div>
  <div class="card"><h3>즉시 수정</h3><p>"버튼을 더 크게", "색을 따뜻하게" 처럼 말로 고칩니다.</p></div>
  <div class="card"><h3>바로 배포</h3><p>완성된 사이트는 igServer에 올려 링크 하나로 공유합니다.</p></div>
</div>
<footer>© STUDIO ig · igBuilder 데모 · igServer 호스팅</footer>
</div>
<script>
function gen(){
  const p=document.getElementById('prompt').value.trim();
  const out=document.getElementById('out');
  if(!p){out.textContent='설명을 입력해 주세요.';return;}
  // 데모: 설명을 섹션 구성으로 분해해 보여준다(실제 생성은 igBuilder 엔진 연동).
  const parts=p.split(/[.,·\n]/).map(s=>s.trim()).filter(Boolean);
  const sections=['헤더 / 로고','소개 섹션',...parts.map(x=>'섹션: '+x),'문의 / 푸터'];
  out.innerHTML='<b style="color:var(--fg)">제안 구성</b><ul style="margin:8px 0 0;padding-left:18px">'+sections.map(s=>'<li>'+s+'</li>').join('')+'</ul>';
}
</script>
</body></html>
